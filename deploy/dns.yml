---
- name: Provision WeatherNigeria DNS
  hosts: weather
  gather_facts: false
  vars:
    domain: weathernigeria.africandroid.world
    dns_provider: cloudflare
    dns_ipv4: 181.214.149.146
    dns_zone_id: "{{ lookup('env', 'CLOUDFLARE_ZONE_ID') }}"
    dns_api_token: "{{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}"
  tasks:
    - name: Configure authoritative DNS and wait for propagation
      ansible.builtin.include_tasks: dns-tasks.yml
