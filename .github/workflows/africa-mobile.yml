name: Build all African weather Android downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: africa-mobile
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build isolated APK for every edition
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 scripts/build_country_apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: AfricaWeather-development-APKs
          path: dist/*
      - name: Publish APKs then wire verified release URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="africa-android-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" dist/*.apk dist/SHA256SUMS --title "African weather Android development apps" --notes "Debug-signed development APKs. Each app opens its country edition. Native geolocation permission is not implemented; search for a city. Production signing and Play Store publication are separate."
          python3 - "$tag" <<'PY'
          import json,sys
          from pathlib import Path
          countries=json.loads(Path('africa/countries.json').read_text())+[{'slug':'africa'}]
          Path('africa/downloads.json').write_text(json.dumps({c['slug']:f'https://github.com/olamidebello/weathernigeria/releases/download/{sys.argv[1]}/weather-{c["slug"]}.apk' for c in countries},indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add africa/downloads.json
          git commit -m 'Publish African weather APK download URLs'
          git pull --rebase origin main
          git push origin HEAD:main
