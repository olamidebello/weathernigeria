name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', 'deploy/mobile.yml', '.github/workflows/mobile.yml']
permissions:
  contents: write
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and Ansible
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          python -m pip install ansible-core==2.18.6
      - name: Build with Ansible
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ansible-playbook deploy/mobile.yml
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherNigeria-Android
          path: dist/*
      - name: Publish development download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$tag" dist/WeatherNigeria.apk dist/WeatherNigeria.apk.sha256 --target "$GITHUB_SHA" --title "WeatherNigeria Android development build ${{ github.run_number }}" --notes "Development APK: requires internet. Opens the live WeatherNigeria service. Select a city manually; native location permission is not implemented. Debug-signed for testing; updates may require uninstalling the previous build. SHA-256 checksum included." --latest
